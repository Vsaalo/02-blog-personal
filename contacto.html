<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de contacto del Blog de Valery para consultas y colaboraciones.">
    <title>Contacto | Blog de Valery</title>
</head>
<body>
    <header>
        <h1>Blog de Valery</h1>
        <p>Disfrutando de lo sencilla que es la vida</p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="articulo-1.html">Artículo 1</a></li>
                <li><a href="articulo-2.html">Artículo 2</a></li>
                <li><a href="sobre-mi.html">Sobre mí</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contacto</h2>
        <p>¿Tienes una pregunta o una propuesta de colaboración? Escríbeme.</p>
        
        <form>
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>
            <p>
                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
            </p>
            <p>
                <label for="asunto">Asunto:</label><br>
                <select id="asunto" name="asunto">
                    <option value="consulta">Consulta</option>
                    <option value="colaboracion">Colaboración</option>
                    <option value="otro">Otro</option>
                </select>
            </p>
            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" cols="40" required></textarea>
            </p>
            <p>
                <button type="submit">Enviar</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Valery. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
